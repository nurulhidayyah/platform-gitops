# timesheet in <project>-<env>. The pipeline copies this folder to
# platform-gitops/services/<ns>/timesheet/ and writes a kustomization.yaml that
# sets the namespace and replaces image `app` with the built tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesheet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timesheet
  template:
    metadata:
      labels:
        app: timesheet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: timesheet
          image: app
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            # PG_* from `make tenant-secret`.
            - secretRef:
                name: timesheet-platform
          env:
            - name: DB_HOST
              value: 172.30.0.1
            - name: OTLP_ENDPOINT
              value: http://172.30.0.1:4318
            # auth's Service in the same namespace; tokens are checked against its keys.
            - name: AUTH_JWKS_URI
              value: http://auth/auth/.well-known/jwks.json
            # Swagger UI on the Dev domain, for the FE team. Set to "false" to hide it.
            - name: SWAGGER_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: timesheet
spec:
  selector:
    app: timesheet
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timesheet
spec:
  ingressClassName: traefik
  rules:
    - host: worklog-dev.hostingskuy.cloud
      http:
        paths:
          - path: /timesheet
            pathType: Prefix
            backend:
              service:
                name: timesheet
                port:
                  name: http
