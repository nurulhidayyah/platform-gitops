# template in <project>-<env>. The pipeline copies this folder to
# platform-gitops/services/<ns>/template/ and writes a kustomization.yaml that
# sets the namespace and replaces image `app` with the built tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: template
  template:
    metadata:
      labels:
        app: template
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: template
          image: app
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            # PG_* and S3_* from `make tenant-secret`. S3 host defaults to DB_HOST.
            - secretRef:
                name: template-platform
            # Non-secret switches flipped with kubectl, without a build (see
            # README). Optional: without it the pod runs on application.yaml
            # defaults. Keys here must not also appear under env, which wins.
            - configMapRef:
                name: template-config
                optional: true
          env:
            - name: DB_HOST
              value: 172.30.0.1
            - name: OTLP_ENDPOINT
              value: http://172.30.0.1:4318
            # auth's Service in the same namespace; tokens are checked against its keys.
            - name: AUTH_JWKS_URI
              value: http://auth/auth/.well-known/jwks.json
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: template
spec:
  selector:
    app: template
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: template
spec:
  ingressClassName: traefik
  rules:
    - host: worklog-dev.hostingskuy.cloud
      http:
        paths:
          - path: /templates
            pathType: Prefix
            backend:
              service:
                name: template
                port:
                  name: http
