# Service contoh untuk menguji mekanisme CI/CD dari ujung ke ujung.
# Deploy = mengganti tag image di bawah; replicas 0 sampai image pertama ada.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: contoh-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
      # Prometheus platform mengambil metrik aplikasi dari sini.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: hello
          image: 127.0.0.1:5000/contoh/hello:d5b66c3
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            # Jaeger platform, dilihat dari dalam cluster. Di laptop, aplikasi
            # memakai bawaannya: localhost:4318 lewat SSH port forwarding.
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: http://172.30.0.1:4318/v1/traces
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # Spring Boot menyalakan grup liveness/readiness sendiri saat mendeteksi
          # dirinya berjalan di Kubernetes.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: contoh-dev
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: contoh-dev
spec:
  ingressClassName: traefik
  rules:
    - host: contoh-dev.hostingskuy.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
