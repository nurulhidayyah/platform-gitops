# Layanan hosting website. Setiap folder sites/<nama>/ menjadi Application
# `site-<nama>` di namespace `site-<nama>`, memakai template di hosting/.
# Berbeda dari `tenants`, isi sites/ ditulis platform sendiri (bukan repo
# pelanggan), jadi project ini boleh membuat Namespace beserta kuota dan
# NetworkPolicy-nya, tapi hanya di namespace site-*.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hosting
  namespace: argocd
  annotations:
    # Harus ada sebelum Application yang memakainya dibuat.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Website pelanggan hosting, satu namespace site-<nama> per website
  sourceRepos:
    - https://github.com/nurulhidayyah/platform-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "site-*"
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sites
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nurulhidayyah/platform-gitops.git
        revision: main
        directories:
          - path: sites/*
  template:
    metadata:
      name: "site-{{ .path.basename }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: hosting
      source:
        repoURL: https://github.com/nurulhidayyah/platform-gitops.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "site-{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
