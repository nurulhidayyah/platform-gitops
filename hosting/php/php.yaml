# Satu website kosong: Apache + PHP dari image hosting/php (platform-infra),
# dengan folder html/ di volume sebagai akar website. Kredensial database ada
# di Secret `site-db`, yang dibuat scripts/site.sh di platform-infra.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: html
  annotations:
    # Berkas website pelanggan: tidak pernah dihapus Argo CD.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  # Volume ReadWriteOnce: pod lama dimatikan dulu.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      # Akar volume dimiliki root. Folder html/ dibuat sebagai www-data, dan
      # diisi halaman sambutan kalau masih kosong.
      initContainers:
        - name: siapkan-volume
          image: 127.0.0.1:5000/hosting/php:8.4.27-1
          command:
            - sh
            - -c
            - |
              mkdir -p /volume/html
              [ -n "$(ls -A /volume/html)" ] || cp /usr/local/share/hosting/index.html /volume/html/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /volume
      containers:
        - name: web
          image: 127.0.0.1:5000/hosting/php:8.4.27-1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: site-db
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: html
              mountPath: /var/www/html
              subPath: html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: html
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik
  rules:
    - host: site-template.hostingskuy.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
