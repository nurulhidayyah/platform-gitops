# auth in <project>-<env>. The pipeline copies this folder to
# platform-gitops/services/<ns>/auth/ and writes a kustomization.yaml that
# sets the namespace and replaces image `app` with the built tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  # The signing key is generated at startup; keep one replica until it moves to a Secret.
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: auth
          image: app
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            # PG_* and REDIS_* from `make tenant-secret`.
            - secretRef:
                name: auth-platform
            # Non-secret switches flipped with kubectl, without a build (see
            # README). Optional: without it the pod runs on application.yaml
            # defaults. Keys here must not also appear under env, which wins.
            - configMapRef:
                name: auth-config
                optional: true
          env:
            - name: DB_HOST
              value: 172.30.0.1
            - name: OTLP_ENDPOINT
              value: http://172.30.0.1:4318
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
spec:
  ingressClassName: traefik
  rules:
    - host: worklog-dev.hostingskuy.cloud
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
