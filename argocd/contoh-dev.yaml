# Project contoh di environment dev: Argo CD membuat isi cluster sama dengan
# folder projects/contoh/dev, termasuk namespace, kuota, dan NetworkPolicy-nya.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contoh-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nurulhidayyah/platform-gitops.git
    targetRevision: main
    path: projects/contoh/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
