# payment in <project>-<env>. The pipeline copies this folder to
# platform-gitops/services/<ns>/payment/ and writes a kustomization.yaml that
# sets the namespace and replaces image `app` with the built tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: payment
          image: app
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            # PG_* from `make tenant-secret`.
            - secretRef:
                name: payment-platform
            # MIDTRANS_SERVER_KEY and MIDTRANS_CLIENT_KEY, created by hand from the
            # Midtrans dashboard (see README). Optional: without it the pod starts
            # and answers 503 to payment requests.
            - secretRef:
                name: payment-midtrans
                optional: true
            # Non-secret switches flipped with kubectl, without a build (see
            # README). Optional: without it the pod runs on application.yaml
            # defaults. Keys here must not also appear under env, which wins.
            - configMapRef:
                name: payment-config
                optional: true
          env:
            - name: DB_HOST
              value: 172.30.0.1
            - name: OTLP_ENDPOINT
              value: http://172.30.0.1:4318
            # auth's Service in the same namespace; tokens are checked against its keys.
            - name: AUTH_JWKS_URI
              value: http://auth/auth/.well-known/jwks.json
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment
spec:
  ingressClassName: traefik
  rules:
    - host: worklog.hostingskuy.cloud
      http:
        paths:
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment
                port:
                  name: http
