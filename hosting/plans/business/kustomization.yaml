# Paket business: container website 1 CPU dan 1Gi memori, disk 10Gi.
# Ukuran disk hanya berlaku saat website dibuat: volume local-path tidak bisa
# diperbesar, jadi naik paket tidak mengubah volume yang sudah ada.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: ResourceQuota
      name: jatah
    patch: |-
      - { op: replace, path: /spec/hard/limits.cpu, value: "1250m" }
      - { op: replace, path: /spec/hard/limits.memory, value: 1152Mi }
      - { op: replace, path: /spec/hard/requests.cpu, value: "300m" }
      - { op: replace, path: /spec/hard/requests.memory, value: 608Mi }
      - { op: replace, path: /spec/hard/requests.storage, value: 10Gi }
  - target:
      kind: Deployment
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/cpu, value: "1" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 1Gi }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "200m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 512Mi }
  - target:
      kind: PersistentVolumeClaim
      name: html
    patch: |-
      - { op: replace, path: /spec/resources/requests/storage, value: 10Gi }
