# Paket starter: container website 250m CPU dan 256Mi memori, disk 1Gi.
# Ukuran disk hanya berlaku saat website dibuat: volume local-path tidak bisa
# diperbesar, jadi naik paket tidak mengubah volume yang sudah ada.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: ResourceQuota
      name: jatah
    patch: |-
      - { op: replace, path: /spec/hard/limits.cpu, value: "500m" }
      - { op: replace, path: /spec/hard/limits.memory, value: 384Mi }
      - { op: replace, path: /spec/hard/requests.cpu, value: "150m" }
      - { op: replace, path: /spec/hard/requests.memory, value: 224Mi }
      - { op: replace, path: /spec/hard/requests.storage, value: 1Gi }
  - target:
      kind: Deployment
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/cpu, value: "250m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 256Mi }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "50m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 128Mi }
  - target:
      kind: PersistentVolumeClaim
      name: html
    patch: |-
      - { op: replace, path: /spec/resources/requests/storage, value: 1Gi }
