# Jatah project worklog di environment dev: namespace, kuota, batas bawaan per
# container, dan isolasi jaringan. Aturan nama: README platform-infra.
apiVersion: v1
kind: Namespace
metadata:
  name: worklog-dev
  labels:
    platform/project: worklog
    platform/env: dev
  annotations:
    # Menghapus namespace berarti menghapus semua isinya, termasuk volume data.
    # Argo CD tidak boleh melakukannya; kalau memang perlu, hapus dengan tangan.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# Satu namespace tidak boleh menghabiskan mesin milik namespace lain. Angka ini
# muat untuk lima service Spring Boot di sekitar 400 MB.
# Limits sengaja lebih longgar dari requests: RollingUpdate menyalakan pod
# pengganti sebelum mematikan yang lama, dan pod itu juga dihitung kuota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jatah
  namespace: worklog-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "8"
    limits.memory: 6Gi
    pods: "20"
---
# Dengan ResourceQuota aktif, pod tanpa requests/limits ditolak. LimitRange
# memberi nilai bawaan supaya manifest yang lupa menulisnya tetap bisa jalan.
apiVersion: v1
kind: LimitRange
metadata:
  name: bawaan
  namespace: worklog-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
# Pod di namespace ini hanya menerima lalu lintas dari sesama pod di namespace
# ini, dari Traefik di kube-system, dan dari host (10.42.0.1), tempat
# Prometheus berjalan untuk mengambil metrik. Keluar, pod boleh ke sesama namespace,
# ke DNS cluster, dan ke luar cluster (datastore di 172.30.0.1, internet), tapi
# tidak ke pod di namespace lain.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolasi-namespace
  namespace: worklog-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 10.42.0.1/32
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
